<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Form e input fields.</title>
  </head>
  <body>
    <h1>Streaming Music App</h1>

    <form onsubmit="alert('Form has been sent')">
      <fieldset class="box-one">
        <legend>About you</legend>
        <div>
          <label for="name"> Name</label>
          <input id="text" type="text" placeholder="Your name" />
        </div>
        <div>
          <label for="surname"> Surname</label>
          <input id="text" type="text" placeholder="Your surname" />
        </div>
        <div>
          <label for="email"> Email</label>
          <input id="email" type="email" placeholder="Your email" />
        </div>
        <div>
          <label for="password"> Password</label>
          <input id="password" type="password" placeholder="Your password" />
        </div>
        <div>
          <label for="date"> D.O.B.</label>
          <input id="date" type="date" name="date" />
        </div>
        <div>
          <label for="number"> Telephone number:</label>
          <input id="number" type="number" placeholder="Your phone number" />
        </div>
      </fieldset>
      <fieldset id="checkbox-section" class="box-two">
        <legend>What genre of music do you like?:</legend>

        <input type="checkbox" id="Classic" />
        <label for="checkbox"> Classic</label>

        <input type="checkbox" id="Rock" />
        <label for="checkbox"> Rock</label>

        <input type="checkbox" id="Pop" />
        <label for="checkbox"> Pop</label>

        <input type="checkbox" id="Electronic" />
        <label for="checkbox"> Electronic</label>
      </fieldset>
      <div>
        <button type="submit" class="button">Send form</button>
      </div>
    </form>
  </body>
</html>
